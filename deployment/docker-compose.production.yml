name: dhisoft-rural

# Production template only. Do not run this file with local secrets or against
# the development database. Put rotated values in .env.production on the host.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [app]
    deploy:
      resources:
        limits:
          memory: 1536M

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    networks: [app]
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/example/dhisoft-rural-backend:release}
    restart: unless-stopped
    env_file: .env.production
    depends_on: [postgres, redis]
    expose: ["7006"]
    networks: [app]
    command: ["node", "dist/main.js"]
    deploy:
      resources:
        limits:
          memory: 768M

  outbox-worker:
    image: ${BACKEND_IMAGE:-ghcr.io/example/dhisoft-rural-backend:release}
    restart: unless-stopped
    env_file: .env.production
    depends_on: [postgres, redis]
    networks: [app]
    command: ["node", "dist/workers/outbox-worker.js"]
    deploy:
      resources:
        limits:
          memory: 512M

  event-consumer-worker:
    image: ${BACKEND_IMAGE:-ghcr.io/example/dhisoft-rural-backend:release}
    restart: unless-stopped
    env_file: .env.production
    depends_on: [postgres, redis]
    networks: [app]
    command: ["node", "dist/workers/event-consumer-worker.js"]
    deploy:
      resources:
        limits:
          memory: 512M

  certificate-worker:
    image: ${BACKEND_IMAGE:-ghcr.io/example/dhisoft-rural-backend:release}
    restart: unless-stopped
    env_file: .env.production
    depends_on: [postgres, redis]
    networks: [app]
    command: ["node", "dist/workers/certificate-worker.js"]
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/example/dhisoft-rural-frontend:release}
    restart: unless-stopped
    env_file: .env.production
    depends_on: [backend]
    expose: ["7000"]
    networks: [app]
    command: ["npm", "run", "start"]
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [frontend, backend]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/rural.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks: [app]
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres-data:
  redis-data:

networks:
  app:
    driver: bridge
