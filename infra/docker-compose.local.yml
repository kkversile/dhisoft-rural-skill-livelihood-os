services:
  postgres:
    image: postgres:16-alpine
    container_name: rural-postgres
    environment:
      POSTGRES_DB: dhisoft_rural_skill
      POSTGRES_USER: dhisoft_rural_skill
      POSTGRES_PASSWORD: local-only-password
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1536M
    restart: unless-stopped

  localstack:
    image: localstack/localstack:3.8
    container_name: rural-localstack
    environment:
      SERVICES: s3,sqs,events
      AWS_DEFAULT_REGION: ap-south-1
      DEBUG: "0"
      PERSISTENCE: "1"
    ports:
      - "127.0.0.1:4567:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          memory: 1536M
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v24.2.18
    container_name: rural-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=768M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://127.0.0.1:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:19644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: rural-redis
    command: ["redis-server", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

volumes:
  postgres-data:
  localstack-data:
  redpanda-data:
